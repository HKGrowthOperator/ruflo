<?xml version="1.0" encoding="UTF-8"?>
<!--
  HK Growth Operator — SIMPLIFIED VECTOR MASTER (DRAFT v0.1, for animation)
  Purpose: clean, simplified, flat interpretation of the H+K tree for motion structure/timing
           (decision D8 = Option A). NOT a redesign, NOT the final brand hero.
  Derived from the reference renders; palette = approximate (replace with official hex).
  Structure preserved: roots (bottom) -> trunk (center) -> H+K letters -> leaf crown (top).
  Replace with the designer's official vector when available.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HK Growth Operator tree logo (draft simplified master)">
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6B33"/>
      <stop offset="1" stop-color="#3F5E2E"/>
    </linearGradient>
  </defs>

  <!-- ===== CROWN (organic leaf canopy — life, growth; NO tech) ===== -->
  <g id="crown">
    <ellipse cx="256" cy="150" rx="150" ry="92" fill="#5E7A3A"/>
    <ellipse cx="170" cy="178" rx="92" ry="66" fill="#6E883F"/>
    <ellipse cx="342" cy="178" rx="92" ry="66" fill="#6E883F"/>
    <ellipse cx="256" cy="120" rx="110" ry="74" fill="#8C9A57"/>
    <ellipse cx="210" cy="110" rx="62" ry="48" fill="#B9C77E"/>
    <ellipse cx="312" cy="120" rx="58" ry="44" fill="#A6B86C"/>
    <ellipse cx="256" cy="96" rx="66" ry="46" fill="#C8D58E"/>
    <!-- a few simple leaf accents -->
    <path d="M256 92 q14 -26 0 -50 q-14 24 0 50 Z" fill="#DCE3B0"/>
    <path d="M196 120 q-22 -16 -44 -8 q18 16 44 8 Z" fill="#C8D58E"/>
    <path d="M316 120 q22 -16 44 -8 q-18 16 -44 8 Z" fill="#C8D58E"/>
  </g>

  <!-- ===== TRUNK (HK operating core) ===== -->
  <path id="trunk-shape" d="M242 232 q-6 70 -2 132 q16 6 32 0 q4 -62 -2 -132 q-14 -6 -28 0 Z" fill="url(#trunk)"/>

  <!-- ===== LETTERS H + K (deep green, gold edge; integrated, upright, readable) ===== -->
  <g id="letters" fill="#3F5E2E" stroke="#C8AE6E" stroke-width="5" stroke-linejoin="round">
    <!-- H (left of trunk) -->
    <rect x="118" y="232" width="30" height="130" rx="3"/>
    <rect x="196" y="232" width="30" height="130" rx="3"/>
    <rect x="148" y="284" width="48" height="26" rx="3"/>
    <!-- K (right of trunk) -->
    <rect x="286" y="232" width="30" height="130" rx="3"/>
    <path d="M316 297 L372 232 L392 246 L344 300 L394 356 L372 368 Z"/>
  </g>

  <!-- ===== ROOTS (foundation, processes, stability) ===== -->
  <g id="roots" fill="none" stroke="#BCA070" stroke-linecap="round">
    <path d="M256 360 q-2 40 -40 64 q-30 18 -70 26" stroke-width="9"/>
    <path d="M256 360 q2 40 40 64 q30 18 70 26" stroke-width="9"/>
    <path d="M250 362 q-20 36 -60 52 q-26 12 -50 14" stroke-width="6"/>
    <path d="M262 362 q20 36 60 52 q26 12 50 14" stroke-width="6"/>
    <path d="M256 362 q0 50 -6 80" stroke-width="7"/>
    <path d="M256 362 q0 50 8 78" stroke-width="5"/>
    <path d="M244 366 q-30 28 -78 36" stroke-width="4"/>
    <path d="M268 366 q30 28 78 36" stroke-width="4"/>
  </g>
</svg>
