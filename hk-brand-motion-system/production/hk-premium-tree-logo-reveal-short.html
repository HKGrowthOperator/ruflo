<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK Growth Operator — Logo Reveal (Short)</title>
<style>
  :root{--green:#3F5E2E;--leaf-l:#C8D58E;--gold:#C8AE6E;--bronze:#A8843E;--ink:#b9c089}
  html,body{margin:0;height:100%;background:#000;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
  .stage{position:relative;width:min(92vw,900px);aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    background:radial-gradient(75% 75% at 50% 40%,#20281b 0%,#141a11 45%,#080b08 100%);box-shadow:0 30px 90px #000c,inset 0 0 120px #0008}
  svg{position:absolute;inset:0;width:100%;height:100%}
  button{background:#1b2416;color:var(--leaf-l);border:1px solid var(--bronze);border-radius:999px;padding:8px 16px;font-size:13px;letter-spacing:.04em;cursor:pointer}
  .flow{stroke-dasharray:5 11;animation:flow 2.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-32}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 1280 720">
      <defs>
        <radialGradient id="halo" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#3a4327" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <linearGradient id="trunkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6B33"/><stop offset="1" stop-color="#2c4620"/></linearGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D49C"/><stop offset="1" stop-color="#A8843E"/></linearGradient>
        <radialGradient id="leafG" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#C8D58E"/><stop offset=".6" stop-color="#6E883F"/><stop offset="1" stop-color="#3F5E2E"/></radialGradient>
      </defs>
      <rect width="1280" height="720" fill="url(#halo)"/>
      <g transform="translate(384,104)">
        <g id="roots" fill="none" stroke="#BCA070" stroke-linecap="round" opacity="0">
          <path d="M256 360 q-2 44 -44 70 q-34 20 -78 28" stroke-width="9"/><path d="M256 360 q2 44 44 70 q34 20 78 28" stroke-width="9"/>
          <path d="M250 362 q-22 40 -66 56 q-28 12 -54 16" stroke-width="6"/><path d="M262 362 q22 40 66 56 q28 12 54 16" stroke-width="6"/>
          <path d="M256 362 q0 54 -8 86" stroke-width="7"/><path d="M256 362 q0 54 9 84" stroke-width="5"/>
        </g>
        <!-- Wurzel-Bedeutung: Fundament/Werte/Prozesse/Analyse/Stabilität -->
        <g id="rootNodes" opacity="0" fill="#E8D49C">
          <circle cx="170" cy="452" r="3.2"/><circle cx="342" cy="452" r="3.2"/><circle cx="200" cy="436" r="2.8"/><circle cx="312" cy="436" r="2.8"/><circle cx="256" cy="450" r="2.6"/>
        </g>
        <g id="trunk"><path d="M242 232 q-7 72 -2 134 q16 7 32 0 q5 -64 -2 -134 q-14 -7 -28 0 Z" fill="url(#trunkG)"/></g>
        <g id="veins" fill="none" stroke="url(#goldG)" stroke-width="1.4" opacity="0">
          <path d="M256 364 C 252 320, 260 290, 256 236" class="flow"/><path d="M248 360 C 244 322, 250 296, 248 250" class="flow"/><path d="M264 360 C 268 322, 262 296, 264 250" class="flow"/>
        </g>
        <g id="hk" opacity="0"><g fill="#3F5E2E" stroke="url(#goldG)" stroke-width="5" stroke-linejoin="round">
          <rect x="118" y="232" width="30" height="130" rx="3"/><rect x="196" y="232" width="30" height="130" rx="3"/><rect x="148" y="284" width="48" height="26" rx="3"/>
          <rect x="286" y="232" width="30" height="130" rx="3"/><path d="M316 297 L372 232 L392 246 L344 300 L394 356 L372 368 Z"/></g></g>
        <g id="crown" opacity="0">
          <ellipse cx="256" cy="150" rx="152" ry="94" fill="url(#leafG)"/><ellipse cx="170" cy="178" rx="92" ry="66" fill="#6E883F"/><ellipse cx="342" cy="178" rx="92" ry="66" fill="#6E883F"/>
          <ellipse cx="256" cy="118" rx="112" ry="76" fill="#8C9A57"/><ellipse cx="208" cy="108" rx="60" ry="46" fill="#B9C77E"/><ellipse cx="312" cy="120" rx="56" ry="44" fill="#A6B86C"/><ellipse cx="256" cy="94" rx="64" ry="46" fill="#C8D58E"/>
        </g>
        <!-- Kronen-Bedeutung: Wachstum/Frucht/Freiheit/Familie/Zeit/Sinn -->
        <g id="crownFruit" opacity="0" fill="#E8D49C">
          <circle cx="206" cy="120" r="3"/><circle cx="300" cy="126" r="3"/><circle cx="256" cy="92" r="2.8"/><circle cx="180" cy="160" r="2.4"/><circle cx="330" cy="160" r="2.4"/>
        </g>
      </g>
      <g id="lockup" opacity="0"><text x="640" y="650" text-anchor="middle" font-size="22" letter-spacing="9" fill="#d8deb0" font-family="Georgia,serif">HK GROWTH OPERATOR</text></g>
    </svg>
  </div>
  <div><button id="replay">⟲ Replay</button> <span style="font-size:12px;color:#6b7350">Logo Reveal · Kurzversion ~9s</span></div>
</div>
<script>
const T=9,$=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),seg=(t,s,e)=>clamp((t-s)/(e-s),0,1),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const set=(id,o,tf)=>{const e=$(id);e.style.opacity=o;if(tf!==undefined)e.style.transform=tf;};
$('trunk').style.transformBox='fill-box';$('trunk').style.transformOrigin='50% 100%';
$('crown').style.transformBox='fill-box';$('crown').style.transformOrigin='50% 92%';
$('roots').style.transformBox='fill-box';$('roots').style.transformOrigin='50% 0%';
$('hk').style.transformBox='fill-box';$('hk').style.transformOrigin='50% 60%';
function frame(t){
  const r=ease(seg(t,0.4,2.2));set('roots',r,`scale(${lerp(0.72,1,r)})`);
  set('rootNodes',seg(t,1.6,2.6)*(1-seg(t,4,5))); // Fundament/Werte/Analyse
  const tr=ease(seg(t,1.8,3.2));set('trunk',t>1.8?1:0,`scaleY(${tr})`);
  set('veins',seg(t,2.6,4));
  const hk=ease(seg(t,2.8,4.2));set('hk',hk,`translateY(${lerp(10,0,hk)}px)`);
  const cr=ease(seg(t,4.6,6.6));set('crown',cr,`scale(${lerp(0.62,1,cr)})`);
  set('crownFruit',seg(t,5.4,6.8)); // Wachstum/Frucht/Freiheit/Sinn
  set('lockup',seg(t,6.8,8));
}
let start=performance.now();
(function loop(now){frame(((now-start)/1000)%T);requestAnimationFrame(loop);})(performance.now());
$('replay').onclick=()=>start=performance.now();
</script>
</body>
</html>
